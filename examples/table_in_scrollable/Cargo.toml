[package]
name = "table_in_scrollable"
description = "A DataTable with its own scrollbar nested inside a scrollable page."
version = "0.7.0"
publish = false
edition.workspace = true

[dependencies]
gpui-kit.workspace = true
gpui.workspace = true

[lints]
workspace = true

# `gpui` is only named by GPUI macro expansions (`IntoElement`, `actions!` …), which
# cargo-machete does not see.
[package.metadata.cargo-machete]
ignored = ["gpui"]
