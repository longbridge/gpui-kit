[package]
name = "text_max_lines"
description = "Clamp rendered Markdown to N whole lines with TextView::max_lines."
version = "0.7.0"
publish = false
edition.workspace = true

[dependencies]
gpui-kit.workspace = true
gpui.workspace = true
reqwest_client.workspace = true
anyhow.workspace = true

[lints]
workspace = true

# `gpui` is only named by GPUI macro expansions (`IntoElement`, `actions!` …), which
# cargo-machete does not see.
[package.metadata.cargo-machete]
ignored = ["gpui"]
