[package]
name = "gpui-kit-recipes"
description = "Tested consumer recipes published verbatim in the documentation."
version = "0.7.0"
publish = false
edition.workspace = true

[dependencies]
gpui-kit.workspace = true
gpui.workspace = true

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }

[lints]
workspace = true

# `gpui` is only named by GPUI macro expansions (`IntoElement`, `actions!` …), which
# cargo-machete does not see.
[package.metadata.cargo-machete]
ignored = ["gpui"]
