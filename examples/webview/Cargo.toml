[package]
name = "webview"
description = "A minimal example of webview inside the GPUI application."
version = "0.7.1"
publish = false
edition.workspace = true

[features]
inspector = []

[dependencies]
# gpui-webview is built on GPUI Fast, so the application must use it too.
gpui-kit = { workspace = true, features = ["gpui-fast"] }
anyhow.workspace = true

# WebView dependencies
gpui-webview = { path = "../../crates/webview" }
wry = { version = "0.53.3", package = "lb-wry" }

[lints]
workspace = true
