[package]
name = "webview"
description = "A minimal example of webview inside the GPUI application."
version = "0.8.1"
publish = false
edition.workspace = true

[features]
inspector = []

[dependencies]
# GPUI Fast lets the example's menu render above the page; `gpui-webview` follows the Kit.
gpui-kit = { workspace = true, features = ["gpui-fast"] }
anyhow.workspace = true

# WebView dependencies
gpui-webview = { path = "../../crates/webview", features = ["gpui-fast"] }
wry = { version = "0.53.3", package = "lb-wry" }

[lints]
workspace = true
