[package]
name = "window_title"
description = "An example of using gpui-component to create a window with a custom title bar."
version = "0.7.0"
publish = false
edition.workspace = true

[dependencies]
gpui-kit.workspace = true
gpui.workspace = true
anyhow.workspace = true

[lints]
workspace = true

# `gpui` is only named by GPUI macro expansions (`IntoElement`, `actions!` …), which
# cargo-machete does not see.
[package.metadata.cargo-machete]
ignored = ["gpui"]
