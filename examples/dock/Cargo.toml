[package]
name = "example-dock"
version = "0.7.0"
publish = false
edition.workspace = true

[dependencies]
gpui-kit.workspace = true
gpui.workspace = true
gpui-component-story = { path = "../../crates/story" }
anyhow.workspace = true
rand = "0.8"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[lints]
workspace = true

# `gpui` is only named by GPUI macro expansions (`IntoElement`, `actions!` …), which
# cargo-machete does not see.
[package.metadata.cargo-machete]
ignored = ["gpui"]
