[package]
name = "hello_world"
description = "A minimal example of application development with GPUI Component."
version = "0.7.0"
publish = false
edition.workspace = true

[dependencies]
anyhow.workspace = true
gpui-kit.workspace = true
gpui.workspace = true

[lints]
workspace = true

# `gpui` is only named by GPUI macro expansions (`IntoElement`, `actions!` …), which
# cargo-machete does not see.
[package.metadata.cargo-machete]
ignored = ["gpui"]
