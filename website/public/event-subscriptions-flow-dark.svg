<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="330" viewBox="0 0 1120 330" role="img" aria-labelledby="title desc">
  <title id="title">One GPUI Event reaches multiple subscribers</title>
  <desc id="desc">Chat emits MessageSent. Separate subscriptions deliver it to Workspace, Activity Log, and Telemetry.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#a9b5c0"/></marker>
    <style>.title{font:700 18px ui-sans-serif,system-ui;fill:#edf2f7}.label{font:600 15px ui-sans-serif,system-ui;fill:#edf2f7}.body{font:400 13px ui-sans-serif,system-ui;fill:#a9b5c0}.code{font:600 14px ui-monospace,SFMono-Regular,monospace;fill:#edf2f7}.source{fill:#172f4c;stroke:#62a5ed;stroke-width:2}.event{fill:#2c2348;stroke:#9c7ae5;stroke-width:2}.subscriber{fill:#193727;stroke:#63b77d;stroke-width:1.5}.path{stroke:#a9b5c0;stroke-width:1.8;fill:none;marker-end:url(#arrow)}.pulse{fill:#b091f0}@media (prefers-reduced-motion:reduce){.pulse{display:none}}</style>
  </defs>
  <rect width="1120" height="330" fill="#10171f"/><text x="28" y="31" class="title">One Event, multiple subscribers</text>
  <rect x="28" y="70" width="220" height="190" rx="14" class="source"/><text x="54" y="108" class="label">Chat</text><text x="54" y="133" class="body">EventEmitter&lt;ChatEvent&gt;</text><rect x="54" y="166" width="168" height="58" rx="9" class="event"/><text x="74" y="191" class="code">MessageSent</text><text x="74" y="212" class="body">cx.emit(...)</text>
  <path id="p1" d="M248 195 C370 195 385 87 520 87" class="path"/><path id="p2" d="M248 195 C370 195 385 165 520 165" class="path"/><path id="p3" d="M248 195 C370 195 385 243 520 243" class="path"/>
  <circle r="6" class="pulse" opacity="0"><animate attributeName="opacity" values="0;1;1;0" dur="2.4s" repeatCount="indefinite"/><animateMotion dur="2.4s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion></circle><circle r="6" class="pulse" opacity="0"><animate attributeName="opacity" values="0;1;1;0" dur="2.4s" repeatCount="indefinite" begin=".35s"/><animateMotion dur="2.4s" repeatCount="indefinite" begin=".35s"><mpath href="#p2"/></animateMotion></circle><circle r="6" class="pulse" opacity="0"><animate attributeName="opacity" values="0;1;1;0" dur="2.4s" repeatCount="indefinite" begin=".7s"/><animateMotion dur="2.4s" repeatCount="indefinite" begin=".7s"><mpath href="#p3"/></animateMotion></circle>
  <rect x="520" y="50" width="290" height="74" rx="12" class="subscriber"/><text x="546" y="79" class="label">Workspace subscriber</text><text x="546" y="102" class="body">refresh the conversation</text><rect x="520" y="128" width="290" height="74" rx="12" class="subscriber"/><text x="546" y="157" class="label">Activity Log subscriber</text><text x="546" y="180" class="body">record the completed send</text><rect x="520" y="206" width="290" height="74" rx="12" class="subscriber"/><text x="546" y="235" class="label">Telemetry subscriber</text><text x="546" y="258" class="body">measure the outcome</text>
  <text x="846" y="108" class="label">Independent delivery</text><text x="846" y="134" class="body">Each Subscription receives</text><text x="846" y="155" class="body">the same typed Event.</text><text x="846" y="201" class="body">No Focus</text><text x="846" y="222" class="body">No Key Context</text><text x="846" y="243" class="body">No Dispatch Path</text>
</svg>
