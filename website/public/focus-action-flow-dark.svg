<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="390" viewBox="0 0 1120 390" role="img" aria-labelledby="title desc">
  <title id="title">How GPUI turns a keystroke into an action</title><desc id="desc">Focus determines a context stack, the context stack matches a key binding, and the resulting action bubbles toward the root.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#a9b5c0"/></marker><style>.t{font:700 18px ui-sans-serif,system-ui;fill:#edf2f7}.l{font:600 15px ui-sans-serif,system-ui;fill:#edf2f7}.b{font:400 13px ui-sans-serif,system-ui;fill:#a9b5c0}.box{fill:#18212b;stroke:#607080;stroke-width:1.5}.active{fill:#172f4c;stroke:#62a5ed;stroke-width:2}.action{fill:#193727;stroke:#63b77d;stroke-width:2}.a{stroke:#a9b5c0;stroke-width:1.7;fill:none;marker-end:url(#arrow)}.d{stroke:#82909d;stroke-width:1.5;stroke-dasharray:6 5;fill:none;marker-end:url(#arrow)}</style></defs><rect width="1120" height="390" fill="#10171f"/>
  <text x="30" y="32" class="t">1. Focus selects a region</text><rect x="30" y="52" width="290" height="290" rx="14" class="box"/><rect x="55" y="78" width="240" height="58" rx="9" class="box"/><text x="74" y="102" class="l">Workspace</text><text x="74" y="122" class="b">two regions side by side</text><rect x="55" y="158" width="104" height="136" rx="9" class="box"/><text x="73" y="187" class="l">Sidebar</text><text x="73" y="211" class="b">context:</text><text x="73" y="229" class="b">Sidebar</text><rect x="171" y="158" width="124" height="136" rx="9" class="active"/><text x="189" y="187" class="l">AI Chat</text><text x="189" y="211" class="b">track_focus</text><text x="189" y="229" class="b">context: AiChat</text><text x="189" y="263" class="b">focused</text><path d="M233 158V136" class="d"/><text x="53" y="320" class="b">Active path: Workspace → AI Chat</text><path d="M333 215H398" class="a"/><text x="345" y="177" class="b">press</text><text x="337" y="197" class="l">⌘ Enter</text>
  <text x="410" y="32" class="t">2. Match the key context</text><rect x="410" y="52" width="300" height="290" rx="14" class="box"/><text x="436" y="89" class="l">Registered bindings</text><rect x="436" y="112" width="248" height="64" rx="9" class="active"/><text x="454" y="138" class="b">⌘ Enter + "AiChat"</text><text x="454" y="160" class="l">→ SendMessage</text><rect x="436" y="194" width="248" height="64" rx="9" class="box"/><text x="454" y="220" class="b">⌘ Enter + "Sidebar"</text><text x="454" y="242" class="l">no binding</text><text x="436" y="291" class="b">The deepest matching context wins.</text><text x="436" y="313" class="b">No matching context means no action.</text><path d="M723 195H788" class="a"/><text x="733" y="177" class="b">dispatch</text>
  <text x="800" y="32" class="t">3. Bubble the Action</text><rect x="800" y="52" width="290" height="290" rx="14" class="box"/><rect x="827" y="82" width="236" height="68" rx="9" class="action"/><text x="846" y="108" class="l">AI Chat handles Send</text><text x="846" y="132" class="b">stops here by default</text><path d="M945 178V150" class="d"/><rect x="847" y="178" width="196" height="52" rx="9" class="box"/><text x="866" y="209" class="l">Pane handler</text><path d="M945 258V230" class="d"/><rect x="867" y="258" width="156" height="52" rx="9" class="box"/><text x="886" y="289" class="l">Workspace</text><text x="824" y="365" class="b">cx.propagate() continues upward.</text>
</svg>
