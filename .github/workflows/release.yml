name: "Release Crate"
on:
  push:
    tags:
      - "v*"
jobs:
  publish_crate:
    name: Publish Crate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Release Crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          # One invocation publishes the whole set: Cargo orders the packages by
          # dependency and waits for each one to appear in the index before
          # publishing the next. `gpui-kit` depends on every layer, so it goes last.
          cargo publish \
            -p gpui-kit-assets \
            -p gpui-component-macros \
            -p gpui-base \
            -p gpui-fps \
            -p gpui-component \
            -p gpui-wry \
            -p gpui-kit
