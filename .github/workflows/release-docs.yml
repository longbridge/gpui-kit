name: Release Docs
on:
  workflow_run:
    workflows: ["Release Crate"]
    types:
      - completed
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write

# Pages accepts one deployment at a time; queue rather than cancel so a release
# deploy is never dropped in favour of a manually dispatched one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' || github.event_name == 'push' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # `workflow_run` reports the commit that triggered the release; the
          # other events carry no such sha and check out their own ref.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Checkout latest approved showcases
        uses: actions/checkout@v4
        with:
          repository: longbridge/gpui-kit-showcases
          ref: main
          path: .showcases
          persist-credentials: false

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.4.0

      - name: Install Showcase validation and rendering dependencies
        working-directory: .showcases
        run: bun install --frozen-lockfile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Setup nightly Rust for GPUI Base WASM
        run: |
          rustup toolchain install nightly --profile minimal
          rustup target add wasm32-unknown-unknown --toolchain nightly

      - name: Install wasm-bindgen-cli
        # Keep the CLI version in sync with the `wasm-bindgen` crate in Cargo.lock
        run: |
          version=$(grep -A 1 '^name = "wasm-bindgen"$' Cargo.lock | grep '^version' | cut -d '"' -f 2)
          cargo install -f wasm-bindgen-cli --version "$version"

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}

      - name: Build Story Web (WASM)
        working-directory: crates/story-web
        run: |
          make build-prod

      - name: Build GPUI Base examples (WASM)
        working-directory: crates/base/examples/wasm
        run: |
          make build

      - name: Build Website
        working-directory: website
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHOWCASES_DIR: ${{ github.workspace }}/.showcases
        run: |
          bun install
          bun run test:showcases
          bun run build

      - name: Copy WASM apps to Website
        run: |
          mkdir -p website/dist/gallery
          cp -r crates/story-web/www/dist/* website/dist/gallery/
          mkdir -p website/dist/examples/base
          cp -r crates/base/examples/wasm/www/dist/* website/dist/examples/base/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "website/dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
