[package]
name = "gpui-kit-assets"
description = "Default bundled assets for GPUI Kit."
keywords = ["desktop", "gpui", "shadcn", "ui", "uikit"]
license = "Apache-2.0"
documentation = "https://docs.rs/gpui-kit-assets"
homepage = "https://gpui-kit.com"
repository = "https://github.com/longbridge/gpui-kit"
readme = "README.md"
edition.workspace = true
publish = true
version = "0.11.0"

# Retain Cargo icon-directory metadata for existing build-script consumers.
links = "gpui-kit-default-icons"

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
gpui = { workspace = true, optional = true }
gpui-fast = { workspace = true, optional = true }
log.workspace = true

[dev-dependencies]
gpui_platform = { workspace = true, features = ["multithreaded", "x11"] }
gpui-fast-platform = { workspace = true, features = ["multithreaded", "x11"] }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
rust-embed = { version = "8.7.2", features = ["interpolate-folder-path", "include-exclude"] }

[target.'cfg(target_family = "wasm")'.dependencies]
reqwest = { workspace = true }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

[features]
default = ["gpui-pre"]
# The default engine, Zed's GPUI through the `gpui-pre` crates. Turn default
# features off and enable `gpui-fast` instead to build without it.
gpui-pre = ["dep:gpui"]
gpui-fast = ["dep:gpui-fast"]
