[package]
name = "gpui-base-examples"
default-run = "components"
version = "0.7.1"
publish = false
edition.workspace = true

[dependencies]
chrono = "0.4.38"
gpui.workspace = true
gpui_fast = { workspace = true, optional = true }
gpui-base = { path = "../.." }
gpui_platform.workspace = true
gpui_platform_fast = { workspace = true, optional = true }
reqwest_client.workspace = true
syntect.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
gpui_fast = { workspace = true, features = ["test-support"] }

[lints]
workspace = true

# The shared showcase is included with `#[path]`, which cargo-machete cannot
# follow when detecting its `chrono`, `gpui`, `gpui_base`, and `syntect` imports.
[package.metadata.cargo-machete]
ignored = ["chrono", "gpui", "gpui-base", "syntect"]

[features]
gpui-fast = ["dep:gpui_fast", "dep:gpui_platform_fast"]
