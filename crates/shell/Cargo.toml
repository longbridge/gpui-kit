[package]
name = "gpui-shell"
description = "A scriptable application runtime for GPUI, built on gpui-base."
version = "0.6.1"
keywords = ["desktop", "gpui", "javascript", "runtime"]
license = "Apache-2.0"
publish = false
edition.workspace = true
repository = "https://github.com/longbridge/gpui-kit"
homepage = "https://gpui-kit.com"

[lib]
name = "gpui_shell"
path = "src/lib.rs"

[[bin]]
name = "gpui-shell"
path = "src/bin/gpui-shell.rs"

[features]
default = ["quickjs"]
# The scripting engine. See `src/engine/mod.rs` for the surface an engine has
# to provide; QuickJS is the only implementation today, and the feature exists
# so a second one can be added without the seam having to be invented first.
quickjs = [
    "dep:rquickjs",
    "dep:rquickjs-jit",
    "dep:quickjs-jit-stdlib",
    "dep:reqwest",
    "dep:tungstenite",
]

[dependencies]
gpui.workspace = true
gpui_platform.workspace = true
gpui-base = { workspace = true, features = ["inspector"] }
gpui-fps.workspace = true

# Keep the bindings, runtime, and LLRT compatibility facade on the same revision.
rquickjs = { package = "quickjs-jit", version = "0.12.7", git = "https://github.com/longbridge/quickjs-jit", rev = "9a83a7f9cdc178a0ab5d7b29c3c9227b0dcb8620", features = [
    "macro",
    "loader",
    "jit-abi",
], optional = true }
rquickjs-jit = { package = "quickjs-jit-runtime", version = "0.12.7", git = "https://github.com/longbridge/quickjs-jit", rev = "9a83a7f9cdc178a0ab5d7b29c3c9227b0dcb8620", features = ["compiler"], optional = true }
# The stdlib facade pins LLRT modules and shares our VM through rquickjs-compat.
quickjs-jit-stdlib = { version = "0.12.7", git = "https://github.com/longbridge/quickjs-jit", rev = "605da483611a3548edb8c33fdff602e3f5f42076", optional = true }
# The date type `gpui_base::Date` is built from, for the calendar binding. Same
# version as `gpui-base`'s, because the two exchange `NaiveDate` values.
chrono = "0.4.38"
cap-std = "4.0.3"
async-channel = "2.5"
fs2 = "0.4"
sha2 = "0.10"
wait-timeout = "0.2"
reqwest = { workspace = true, features = ["blocking"], optional = true }
tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots", "url"], optional = true }

anyhow.workspace = true
instant.workspace = true
schemars.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
smallvec.workspace = true
tracing.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[lints]
workspace = true
