[package]
name = "gpui-kit-backend-macros"
description = "GPUI's `gpui_macros` from whichever implementation `gpui-kit-backend` picks."
version = "0.0.0"
license = "Apache-2.0"
publish = false
edition.workspace = true

[lints]
workspace = true

[lib]
path = "lib.rs"
doctest = false

[features]
gpui-fast = ["gpui-kit-backend/gpui-fast"]
inspector = ["gpui-kit-backend/macros-inspector"]

[dependencies]
gpui-kit-backend.workspace = true
