[package]
name = "gpui-component-story"
version = "0.6.0"
publish = false
edition.workspace = true

[features]
inspector = ["gpui-kit/inspector"]
tree-sitter = ["gpui-kit/tree-sitter-languages"]
test-support = ["gpui-kit/test-support"]
default = ["tree-sitter"]

[dependencies]
anyhow.workspace = true
gpui-kit.workspace = true
gpui-fps.workspace = true

async-channel = "2.3.1"
autocorrect = "2.14.2"
chrono = "0.4"
csv = "1.4"
fake = { version = "2.10.0", features = ["dummy"] }
itertools = "0.14.0"
rand = "0.8"
regex = "1"
serde = "1"
serde_json = "1"
tracing.workspace = true
tracing-subscriber = { version = "0.3.22", features = [
  "env-filter",
  "fmt",
  "registry",
], default-features = false }
unindent = "0.2.3"
rust-i18n.workspace = true
dirs = "6.0.0"

# Native-only dependencies (not available on WASM)
[target.'cfg(not(target_family = "wasm"))'.dependencies]
gpui-shell.workspace = true
reqwest_client.workspace = true
smol.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
# WASM has no tree-sitter grammars, so the Editor story highlights with
# `syntect` there. Native uses the built-in tree-sitter highlighter.
syntect.workspace = true
# `rand 0.8` (via `fake`) does not enable the `js` feature of getrandom,
# which is required to build for wasm32-unknown-unknown.
getrandom = { version = "0.2", features = ["js"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18" }

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
