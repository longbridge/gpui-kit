[package]
name = "gpui-kit-core"
version = "0.7.1"
edition.workspace = true
license = "Apache-2.0"
publish = true
repository = "https://github.com/longbridge/gpui-kit"
description = "Shared gpui backend selection for GPUI Kit."

[lints]
workspace = true

[features]
default = ["font-kit", "wayland", "x11", "windows-manifest"]
gpui-fast = ["dep:fast"]
font-kit = ["gpui_upstream/font-kit", "fast?/font-kit"]
bench = ["gpui_upstream/bench", "fast?/bench"]
bench-support = ["gpui_upstream/bench-support", "fast?/bench-support"]
inspector = ["gpui_upstream/inspector", "fast?/inspector", "gpui_macros/inspector"]
leak-detection = ["gpui_upstream/leak-detection", "fast?/leak-detection"]
profiler = ["gpui_upstream/profiler", "fast?/profiler"]
screen-capture = ["gpui_upstream/screen-capture", "fast?/screen-capture"]
stacker = ["gpui_upstream/stacker", "fast?/stacker"]
test-support = ["gpui_upstream/test-support", "fast?/test-support"]
wayland = ["gpui_upstream/wayland", "fast?/wayland"]
windows-manifest = ["gpui_upstream/windows-manifest", "fast?/windows-manifest"]
x11 = ["gpui_upstream/x11", "fast?/x11"]

[dependencies]
gpui_upstream.workspace = true
fast = { package = "gpui-fast", version = "0.1.0", default-features = false, optional = true }
gpui_macros.workspace = true
