[package]
name = "gpui-webview"
description = "WebView support for GPUI, based on Wry."
keywords = ["webview", "gpui", "wry"]
license = "Apache-2.0"
documentation = "https://docs.rs/gpui-webview"
homepage = "https://gpui-kit.com"
repository = "https://github.com/longbridge/gpui-kit/tree/main/crates/webview"
readme = "README.md"
edition.workspace = true
publish = true
version = "0.7.1"

[features]
# GPUI Fast is always used; this feature is kept so existing manifests that enable it still resolve.
gpui-fast = []
inspector = ["wry/devtools"]

[lib]
doctest = false

[dependencies]
anyhow.workspace = true
# Enabling `gpui-fast` here selects GPUI Fast for the application's `gpui-kit` too, through
# feature unification, so applications need no extra configuration.
gpui-kit = { path = "../kit", version = "0.7.1", default-features = false, features = ["gpui-fast"] }
log = "0.4"
wry = { version = "0.53.3", package = "lb-wry" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSView"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
